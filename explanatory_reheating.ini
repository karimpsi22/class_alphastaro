# Example input file: alpha-Starobinsky inflation with reheating.
#
# With use_reheating = yes the pivot is not set by hand (N_star, ln_aH_ratio).
# Instead phi_pivot is solved for so that the number of e-folds between the horizon
# crossing of k_pivot and the end of inflation (ddot(a) = 0) equals the one implied
# by the reheating history (w_re, T_reh, g_re, g_sre). The inputs of the primordial
# sector are then (V0, alpha, w_re, T_reh); A_s, n_s, r and alpha_s are outputs.
#
# Run with:  ./class explanatory_reheating.ini
# From python, besides the usual outputs, get_current_derived_parameters accepts
#   'phi_pivot', 'phi_end_inflation', 'N_star', 'N_re', 'T_max_reheating'
# (N_star = e-folds from pivot crossing to the end of inflation, N_re = e-folds of
# reheating, T_max_reheating = temperature of instantaneous reheating).

# --- background and cosmology -------------------------------------------------
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.1200
tau_reio = 0.0544
N_ur = 2.0328
N_ncdm = 1
m_ncdm = 0.06

output = tCl,pCl,lCl
lensing = yes
l_max_scalars = 2500

# --- primordial spectrum: numerical inflation with the alpha-Starobinsky potential
#   V(phi) = V0 (1 - exp(sqrt(2/(3 alpha)) phi))^2,   Vparam0 = V0, Vparam1 = alpha
# Tensors are needed to get r.
modes = s,t
Pk_ini_type = inflation_V_end
inflation_behavior = numerical
full_potential = alphastaro
Vparam0 = 2.0e-13
Vparam1 = 1.0

# phi_end only brackets the end of inflation: epsilon must be larger than 1 there.
# For alphastaro, phi_end = 0.8 ln(c/(2+c)) / (b sqrt(8 pi)) with
# b = sqrt(2/(3 alpha)), c = sqrt(3 alpha) works for any alpha (-0.15 for alpha = 1).
phi_end = -0.15

# alpha_s and beta_s are finite differences of ln P(k): 1e-5 avoids spurious jumps
# (the default 1e-3 is enough for n_s and r).
primordial_inflation_tol_curvature = 1.e-5

# --- reheating ------------------------------------------------------------------
# w_re   effective equation of state during reheating
# T_reh  reheating temperature in GeV
# g_re   relativistic degrees of freedom at reheating
# g_sre  entropy degrees of freedom at reheating
# 'N_star' and 'ln_aH_ratio' must not be given together with use_reheating = yes.
use_reheating = yes
w_re = 0.0
T_reh = 1.e10
g_re = 106.75
g_sre = 106.75

# With reheating_bounds = yes (default) a point outside the physical range makes
# the run fail with a computation error, which a sampler treats as a rejected
# point: -1/3 < w_re <= 1, T_reh >= 4 MeV (BBN) and T_reh <= T_max. The limits can
# be changed, or the check removed with reheating_bounds = no.
reheating_bounds = yes
reheating_w_re_min = -0.3323333
reheating_w_re_max = 1.0
reheating_T_re_min = 4.e-3

# --- output ---------------------------------------------------------------------
root = output/reheating_example_
write parameters = yes
primordial_verbose = 1
